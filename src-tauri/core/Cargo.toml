[package]
name = "cheatkeys-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Framework-agnostic core: cheat sheet loading, rendering, search"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
pulldown-cmark = "0.12"
ammonia = "4"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
