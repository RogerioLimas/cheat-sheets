[package]
name = "cheatkeys"
version = "0.1.0"
description = "Instant cheat sheets via a global shortcut"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cheatkeys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cheatkeys-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
